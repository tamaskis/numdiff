[package]
name = "numdiff"
version = "0.11.0"
authors = ["Tamas Kis"]
edition = "2024"
description = "Numerical differentiation via forward-mode automatic differentiation and finite difference approximations."
documentation = "https://docs.rs/numdiff"
repository = "https://github.com/tamaskis/numdiff"
license = "MIT OR Apache-2.0"
keywords = ["numerical", "differentiation", "finite-difference", "forward-mode", "autodiff"]
categories = ["mathematics", "science"]

exclude = [".gitignore", ".github/", ".vscode/", "Cargo.lock", "book/"]

[package.metadata.docs.rs]
rustdoc-args = [ "--html-in-header", "src/docs-header.html" ]
features = ["faer", "nalgebra", "ndarray"]

[features]
faer = [
    "dep:faer", # enabling faer in this crate
    "dep:faer-traits", # enabling faer-traits in this crate
    "linalg-traits/faer", # enabling faer in linalg-traits
]
nalgebra = [
    "dep:nalgebra", # enabling nalgebra in this crate
    "linalg-traits/nalgebra" # enabling nalgebra in linalg-traits
]
ndarray = [
    "dep:ndarray", # enabling ndarray in this crate
    "linalg-traits/ndarray" # enabling ndarray in linalg-traits
]

[dependencies]
linalg-traits = "0.19.2"
faer = { version = "0.24.4", optional = true }
faer-traits = { version = "0.24.0", optional = true }
nalgebra = { version = "0.35.0", optional = true }
ndarray = { version = "0.17.2", optional = true }
num-traits = "0.2.19"
trig = { version = "0.4.0", optional = true }

[dev-dependencies]
numtest = "0.5.0"